name: Android Agenda CI

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - "android/**"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaEntry.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaOperation.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaSyncJournal.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaStore.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaSyncProtocol.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaPanel.java"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - "android/**"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaEntry.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaOperation.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaSyncJournal.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaStore.java"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android Agenda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
