name: Android NeuroCenter CI

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - "android/**"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaEntry.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaOperation.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaSyncJournal.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaStore.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaSyncProtocol.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaPanel.java"
      - "src/main/java/com/neurocenter/api/NeuroPlatform.java"
      - "src/main/java/com/neurocenter/api/NeuroAppContext.java"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - "android/**"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaEntry.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaOperation.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaSyncJournal.java"
      - "src/main/java/com/neurocenter/apps/agenda/AgendaStore.java"
      - "src/main/java/com/neurocenter/api/NeuroPlatform.java"
      - "src/main/java/com/neurocenter/api/NeuroAppContext.java"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android NeuroCenter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK, NDK and CMake
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Verify JRE 21 actually bundled into APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/neurojre21/lib/modules
        uses: actions/upload-artifact@v4
        with:
          name: neurocenter-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/libjvm.so
        uses: actions/upload-artifact@v4
        with:
          name: neurocenter-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/libneurojvm.so
        uses: actions/upload-artifact@v4
        with:
          name: neurocenter-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

          test -s android/app/build/generated/java21/assets/neurojre21/lib/modules

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neurocenter-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
