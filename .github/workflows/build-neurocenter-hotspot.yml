name: Build patched OpenJDK 21 ARM64 (experimental)

on:
  workflow_dispatch:
  push:
    branches: [ "feature/android10-java21-ncapp" ]
    paths:
      - "android/openjdk21/**"
      - ".github/workflows/build-neurocenter-hotspot.yml"

permissions:
  contents: read

jobs:
  build-openjdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout NeuroCenter
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install vendor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf python3 python-is-python3 unzip zip \
            systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev \
            libxrender-dev libxtst-dev libxt-dev

      - name: Checkout exact JRE vendor sources and add source patch
        run: |
          git clone --branch buildjre17-21 \
            https://github.com/AngelAuraMC/angelauramc-openjdk-build.git vendor
          git -C vendor checkout 196da32d80fe96d6967ca1c154f102cff0dfc389
          cp android/openjdk21/patches/90_neurocenter_native_jimage_home.diff \
            vendor/patches/jre_21/android/
          cp android/openjdk21/patches/91_neurocenter_icholder_android_heap_tag.diff \
            vendor/patches/jre_21/android/
          echo "Patch:"
          sha256sum vendor/patches/jre_21/android/90_neurocenter_native_jimage_home.diff
          sha256sum vendor/patches/jre_21/android/91_neurocenter_icholder_android_heap_tag.diff

      - name: Build JRE 21 ARM64 from patched source
        working-directory: vendor
        env:
          TARGET_VERSION: "21"
          TOO_MANY_CORES: "1"
        run: bash ./1_ci_build_arch_aarch64.sh

      - name: Verify built binary contains NeuroCenter home hook
        run: |
          shopt -s nullglob
          files=(vendor/jre21-android-arm64-*.tar.xz)
          test ${#files[@]} -eq 1
          mkdir -p extracted
          tar -xJf "${files[0]}" -C extracted
          test -s extracted/lib/server/libjvm.so
          strings extracted/lib/server/libjvm.so | grep -F NEUROCENTER_JRE_HOME
          strings extracted/lib/server/libjvm.so | grep -F 'NeuroCenter CompiledICHolder mapping'

      - name: Upload experimental OpenJDK 21 runtime
        uses: actions/upload-artifact@v4
        with:
          name: neurocenter-openjdk21-arm64-icholder-experimental
          path: vendor/jre21-android-arm64-*.tar.xz
          if-no-files-found: error
          retention-days: 14
