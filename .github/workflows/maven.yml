name: Maven CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-windows-exe:
    name: Build Windows EXE installer (Java 21)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($null -eq $command) { throw "Inno Setup 6 (ISCC.exe) no encontrado." }
            $compiler = $command.Source
          }
          Write-Host "Compilador Inno Setup: $compiler"

      - name: Build, test and package EXE
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify installer and per-user upgrade
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/installer -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "No se generó el instalador EXE." }
          $testDir = Join-Path $env:RUNNER_TEMP "NeuroCenter-Installer-Smoke"
          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$testDir"
          if ($LASTEXITCODE -ne 0) { throw "Fallo en instalación limpia: $LASTEXITCODE" }
          $exe = Join-Path $testDir "Center of Neurodivergence.exe"
          $jar = Join-Path $testDir "app/center-of-neurodivergence.jar"
          $jre = Join-Path $testDir "runtime/bin/server/jvm.dll"
          if (!(Test-Path $exe) -or !(Test-Path $jar)) {
            throw "El instalador no instaló el lanzador o la aplicación."
          }
          if (!(Test-Path (Join-Path $testDir "runtime"))) {
            throw "El instalador no incluyó Java 21."
          }
          # Reinstall/update the same AppId without requiring an uninstall.
          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$testDir"
          if ($LASTEXITCODE -ne 0) { throw "Fallo al actualizar: $LASTEXITCODE" }
          if (!(Test-Path $exe) -or !(Test-Path $jar)) {
            throw "La actualización dejó la aplicación incompleta."
          }
          $uninstaller = Get-ChildItem $testDir -Filter "unins*.exe" | Select-Object -First 1
          if ($uninstaller) {
            & $uninstaller.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
            if ($LASTEXITCODE -ne 0) { throw "Fallo al desinstalar el paquete de prueba." }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: center-of-neurodivergence-windows-exe
          path: target/installer/**/*.exe
          if-no-files-found: error

  build:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and install the desktop API
        run: mvn --batch-mode --no-transfer-progress clean install

      - name: Verify Java 21 Security Manager runtime
        run: java -Djava.security.manager=allow -jar target/center-of-neurodivergence.jar --security-self-test

      - name: Build sample multiplatform .ncapp (Java 21)
        run: |
          mkdir -p target/ncapp-example-classes
          javac --release 21 -cp target/center-of-neurodivergence.jar \
            -d target/ncapp-example-classes examples/ncapp-demo/src/main/java/com/neurocenter/demo/*.java
          jar --create --file target/neurocenter-demo.ncapp \
            --manifest examples/ncapp-demo/MANIFEST.MF \
            -C target/ncapp-example-classes . \
            -C examples/ncapp-demo META-INF
          unzip -l target/neurocenter-demo.ncapp | grep -F 'com/neurocenter/demo/DemoMobile.class'
          unzip -p target/neurocenter-demo.ncapp META-INF/MANIFEST.MF | grep -F 'NeuroCenter-Mobile-Class: com.neurocenter.demo.DemoMobile'

      - name: Upload multiplatform Java 21 sample
        uses: actions/upload-artifact@v4
        with:
          name: neurocenter-example-ncapp
          path: target/neurocenter-demo.ncapp
          if-no-files-found: error

      - name: Build the external app example (.ncapp)
        run: |
          mvn --batch-mode --no-transfer-progress -f example-app/pom.xml clean verify
          test -s example-app/target/hello-app.ncapp
