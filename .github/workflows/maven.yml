name: Maven CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-windows-exe:
    name: Build Windows EXE installer (Java 17)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --no-progress -y
          $wixRoot = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.14"
          $wixBin = Join-Path $wixRoot "bin"
          if (!(Test-Path (Join-Path $wixBin "candle.exe")) -or !(Test-Path (Join-Path $wixBin "light.exe"))) {
            $candle = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Filter candle.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $candle) {
              throw "No se encontró candle.exe después de instalar WiX Toolset."
            }
            $wixBin = $candle.DirectoryName
          }
          if (!(Test-Path (Join-Path $wixBin "light.exe"))) {
            throw "No se encontró light.exe en $wixBin."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          Write-Host "WiX Toolset añadido al PATH: $wixBin"

      - name: Verify WiX tools
        shell: pwsh
        run: |
          Get-Command candle.exe
          Get-Command light.exe

      - name: Build, test and package EXE
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: center-of-neurodivergence-windows-exe
          path: target/installer/**/*.exe
          if-no-files-found: error

  build:
    name: Build and test (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and verify with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify
