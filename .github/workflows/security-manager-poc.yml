name: Java 21 Security Manager POC

on:
  push:
    branches:
      - experiment/security-manager-poc
    paths:
      - "security-poc/**"
      - ".github/workflows/security-manager-poc.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "security-poc/**"
      - ".github/workflows/security-manager-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-manager-poc:
    name: Verify Java 21 permission enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build proof of concept
        working-directory: security-poc
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Run restricted application
        working-directory: security-poc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/poc-data/allowed
          printf 'allowed-fixture' > target/poc-data/allowed/fixture.txt
          printf 'secret-outside-allowlist' > target/poc-data/forbidden.txt

          java \
            -Djava.security.manager \
            "-Djava.security.policy==file:$PWD/src/main/resources/poc.policy" \
            -jar target/security-manager-poc-0.1.0.jar \
            "$PWD/target/poc-data/allowed" \
            "$PWD/target/poc-data/forbidden.txt"
